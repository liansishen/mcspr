<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MCS Panel · Minecraft 服务端管理面板</title>
<script>
/* 提前应用主题，避免加载闪烁；优先 localStorage，其次跟随系统偏好 */
(function () {
  var t = null;
  try { t = localStorage.getItem('mcspr.theme'); } catch (e) {}
  if (t !== 'light' && t !== 'dark' && t !== 'mc') {
    t = window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
  }
  var de = document.documentElement;
  de.classList.toggle('light', t === 'light');
  de.classList.toggle('mc', t === 'mc');
})();
</script>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🟩</text></svg>">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div id="app">
  <aside id="sidebar">
    <div class="brand">🌱 <span>MCS Panel</span></div>
    <nav id="nav">
      <a href="#/dashboard" data-nav="dashboard">📊 仪表盘</a>
      <a href="#/instances" data-nav="instances">🗂 实例管理</a>
      <a href="#/settings" data-nav="settings">⚙️ 面板设置</a>
      <button id="theme-toggle" class="theme-toggle" onclick="toggleTheme()">🎨 深色</button>
    </nav>
    <div class="side-foot">
      <div class="muted small">MCS Panel v<span id="ver"></span></div>
      <div class="muted small">Rust · Axum · Tokio</div>
    </div>
  </aside>
  <main id="main"></main>
</div>
<div id="modal-root"></div>
<div id="toast-root"></div>
<script src="/app.js"></script>
<script>
fetch('/api/ping').then(r => r.json()).then(j => {
  document.getElementById('ver').textContent = j.version;
  if (j.auth_required && !TOKEN) showTokenModal();
}).catch(() => {});
</script>
</body>
</html>
