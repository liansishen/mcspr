# MCS Panel 双平台自动构建：推送 v* 标签时构建并发布 Release
# 产物：
#   - mcspr-windows-x64.zip   （Windows x64，内嵌前端）
#   - mcspr-linux-x64.tar.gz  （Linux x64，musl 静态链接，任何发行版直接运行）
#   - mcspr-linux-arm64.tar.gz（Linux ARM64，musl 静态链接）
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: mcspr-windows-x64.zip
            archive: zip
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            artifact: mcspr-linux-x64.tar.gz
            archive: tar
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            artifact: mcspr-linux-arm64.tar.gz
            archive: tar
            cross: true

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: 安装 musl 工具（Linux x64）
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: 安装 cross（Linux arm64 交叉编译）
        if: matrix.cross
        run: cargo install cross --locked

      - name: 构建（cross 交叉编译）
        if: matrix.cross
        run: cross build --release --target ${{ matrix.target }}

      - name: 构建
        if: ${{ !matrix.cross }}
        run: cargo build --release --target ${{ matrix.target }}

      - name: 打包
        shell: bash
        run: |
          cd "target/${{ matrix.target }}/release"
          if [ "${{ matrix.archive }}" = "zip" ]; then
            7z a "../../..//${{ matrix.artifact }}" mcspr.exe
          else
            tar czf "../../../${{ matrix.artifact }}" mcspr
          fi

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: 下载全部产物
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist

      - name: 发布 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
